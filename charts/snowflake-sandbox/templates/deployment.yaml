apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snowflake-sandbox.fullname" . }}
  labels:
    {{- include "snowflake-sandbox.labels" . | nindent 4 }}
  {{- if and .Values.ttl.enabled .Values.ttl.seconds }}
  annotations:
    cloudlab.io/ttl-seconds: "{{ .Values.ttl.seconds }}"
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "snowflake-sandbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snowflake-sandbox.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8888
          env:
            - name: SNOWFLAKE_ACCOUNT
              value: "{{ .Values.snowflake.account }}"
            - name: SNOWFLAKE_USER
              value: "{{ .Values.snowflake.user }}"
            - name: SNOWFLAKE_WAREHOUSE
              value: "{{ .Values.snowflake.warehouse }}"
            - name: SNOWFLAKE_DATABASE
              value: "{{ .Values.snowflake.database }}"
            - name: SNOWFLAKE_SCHEMA
              value: "{{ .Values.snowflake.schema }}"
            {{- if .Values.snowflake.role }}
            - name: SNOWFLAKE_ROLE
              value: "{{ .Values.snowflake.role }}"
            {{- end }}
            - name: SNOWFLAKE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snowflake.passwordSecretRef }}
                  key: password
          {{- if .Values.configmap.enabled }}
          envFrom:
            - configMapRef:
                name: {{ include "snowflake-sandbox.fullname" . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: 8888
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: 8888
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          volumeMounts:
            - name: data
              mountPath: /home/jovyan
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "snowflake-sandbox.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }} 