{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "snowflake-sandbox.fullname" . }}
  labels:
    {{- include "snowflake-sandbox.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "snowflake-sandbox.fullname" . }}
                port:
                  number: 8888
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "snowflake-sandbox.fullname" . }}-tls
  {{- end }}
{{- end }} 