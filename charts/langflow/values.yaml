image:
  repository: langflowai/langflow
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7860

ingress:
  enabled: true
  className: nginx
  annotations: 
    cert-manager.io/cluster-issuer: kloudlite-cert-issuer
  host: langflow.machinehack-new.clients.kloudlite.io
  paths:
    - path: /
      pathType: Prefix
  tls:
    enabled: true
    clusterIssuer: "kloudlite-cert-issuer"

replicaCount: 1
resources: {}

env: []

nodeSelector: {}
tolerations: []
affinity: {}
