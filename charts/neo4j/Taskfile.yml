version: 3

vars:
  ReleaseName: "neo4j"
  ReleaseNamespace: "testing-neo4j"

tasks:
  install:
    cmds:
      - helm upgrade --install {{.ReleaseName}} -n {{.ReleaseNamespace}} --create-namespace .

  template:
    cmds:
      - helm template --dry-run {{.ReleaseName}} -n {{.ReleaseNamespace}} --create-namespace . --set ingress.host=neo4j-instance.machinehack-new.clients.kloudlite.io

  uninstall:
    cmds:
      - helm uninstall {{.ReleaseName}} -n {{.ReleaseNamespace}}
