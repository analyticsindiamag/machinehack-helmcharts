codeServer:
  repository: "https://github.com/kloudlite/website.git"
  branch: "release-v1.0.0"
  storage: 
    size: "5Gi"
    className: "standard"  # Adjust this based on your cluster's storage class

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  ingress:
    enabled: true
    className: "nginx"
    host: "vscode-web.machinehack-new.clients.kloudlite.io"  # Change this to your desired hostname
    cors:
      enabled: true
      origins: ["*"] 