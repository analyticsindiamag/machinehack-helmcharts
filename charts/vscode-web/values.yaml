codeServer:
  repository: "https://github.com/kloudlite/website.git"
  branch: "release-v1.0.0"
  storage: 
    size: "5Gi"
    className: ""

  nodeSelector: {}
  tolerations:
  - key: small_1
    operator: "Equal"
    value: "true"
    effect: NoSchedule

  extensions: []

  # resources:
  #   requests:
  #     cpu: "100m"
  #     memory: "150Mi"
  #   limits:
  #     cpu: "200m"
  #     memory: "300Mi"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"


  ingress:
    enabled: true
    className: nginx
    clusterIssuer: "kloudlite-cert-issuer"
    host: "google.com"  # Replace with your actual domain
    cors:
      enabled: false
      origins: []
