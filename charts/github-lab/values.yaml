image:
  repository: ghcr.io/github-lab/github-lab
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: github-lab.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

env: {}

livenessProbe:
  enabled: true
  path: /
  port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

prometheus:
  enabled: true
  path: /metrics
  port: 3000

secret:
  githubClientId: ""
  githubClientSecret: "" 