notebook:
  storage: 
    size: "5Gi"
    className: ""

  nodeSelector: {}
  tolerations: []

  resources:
    requests:
      cpu: "500m"
      memory: "500Mi"
    limits:
      cpu: "1000m"
      memory: "1000Mi"

  ingress:
    enabled: false
    className: "nginx" #updated this [regression was working fine without this change]

    host: "google.com" #updated this [regression was working fine without this change]
    clusterIssuer: "kloudlite-cert-issuer" #updated this  [regression was working fine  without this change]

    cors:
      enabled: false
      origins: []

mongodb:
  enabled: false

  storage:
    size: "1Gi"

  nodeSelector: {}
  tolerations: []

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
