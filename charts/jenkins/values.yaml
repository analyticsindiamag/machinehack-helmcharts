# Jenkins Controller configuration
controller:
  type: "ClusterIP"
  servicePort: 8080
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  serviceAccount:
    name: "jenkins-admin"
  adminUser: "admin"
  adminPassword: "jenkins-admin"

# Image configuration
image:
  pullPolicy: "Always"

# Ingress configuration
ingress:
  enabled: true
  host: "jenkins.{{ .Values.domain }}"
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "kloudlite-cert-issuer"
  tls:
    - secretName: jenkins-tls
      hosts:
        - "jenkins.{{ .Values.domain }}"
  cors:
    enabled: true
    origins:
      - "https://jenkins.{{ .Values.domain }}"
      - "https://{{ .Values.domain }}"

# Persistence configuration
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  storageClass: "kloudlite-storage-class"

# Domain configuration
domain: "example.com" 