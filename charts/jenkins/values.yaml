controller:
  serviceType: ClusterIP
  installPlugins:
    - kubernetes:3937.vd7b_82db_e347b_
    - workflow-aggregator:590.v6a_d052e5a_a_b_5
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  servicePort: 8080
  serviceAccount:
    name: jenkins-admin
  adminUser: "admin"
  adminPassword: "jenkins-admin"
  jenkinsOpts: ""

image:
  pullPolicy: Always

ingress:
  enabled: true
  host: "jenkins.{{ .Values.domain }}"
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "kloudlite-cert-issuer"
  tls:
    - secretName: jenkins-tls
      hosts:
        - "jenkins.{{ .Values.domain }}"
  cors:
    enabled: true
    origins:
      - "https://jenkins.{{ .Values.domain }}"
      - "https://{{ .Values.domain }}"

expose:
  enabled: true
  host: ""
  port: 8080

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  storageClass: "kloudlite-storage-class"

# Domain configuration - this should be overridden by the user
domain: "example.com" 