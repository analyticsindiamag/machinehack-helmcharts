apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-credentials
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # These are base64 encoded values. Replace with your actual base64 encoded values
  # You can generate these using: echo -n "your-username" | base64
  jenkins-admin-user: {{ .Values.controller.adminUser | default "admin" | b64enc | quote }}
  jenkins-admin-password: {{ .Values.controller.adminPassword | default "admin123" | b64enc | quote }} 