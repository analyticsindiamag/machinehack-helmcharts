apiVersion: v1
kind: Secret
metadata:
  name: "{{.Release.Name}}-exports"
  namespace: {{.Release.Namespace}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
type: Opaque
stringData:
  URL: http://{{.Values.ingress.host}}
  JENKINS_URL: http://{{.Values.ingress.host}}
  JENKINS_USER: "{{.Values.controller.adminUser}}"
  JENKINS_PASSWORD: "{{.Values.controller.adminPassword}}"
  JENKINS_HOST: "{{.Release.Name}}-jenkins.{{.Release.Namespace}}.svc.cluster.local"
  JENKINS_PORT: "{{.Values.controller.servicePort}}"
