ingress:
  enabled: true
  host: "haproxy.example.com"
  className: nginx
  clusterIssuer: "kloudlite-cert-issuer"
  cors:
    enabled: false
    origins: []
  ssl:
    enabled: true
    redirect: true

replicaCount: 1

image:
  repository: haproxy
  tag: "2.8.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http:
      port: 80
      targetPort: 80
    https:
      port: 443
      targetPort: 443
    stats:
      port: 8404
      targetPort: 8404

config:
  defaultBackend: "app-service:80"
  compression:
    enabled: true
    types: "text/html text/plain text/css application/javascript application/json"
  headers:
    enabled: true
    add:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
  stats:
    enabled: true
    uri: "/haproxy-stats"
    auth:
      enabled: true
      username: admin
      password: admin
  ssl:
    enabled: true
    redirect: true

resources: {}

nodeSelector: {}

tolerations: []

affinity: {} 