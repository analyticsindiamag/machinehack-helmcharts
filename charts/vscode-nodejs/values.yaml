codeServer:
  repository: "https://github.com/karthik1729/sample-nodejs.git"
  branch: "main"
  storage: 
    size: "5Gi"
    className: ""

  nodeSelector: {}
  tolerations: []

  extensions: []

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  ingress:
    enabled: true
    className: nginx
    clusterIssuer: "kloudlite-cert-issuer"
    host: "google.com"
    cors:
      enabled: false
      origins: []

mongodb:
  enabled: false
  storage:
    size: "1Gi"
    # className: ""

  nodeSelector: {}
  tolerations: []

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"
